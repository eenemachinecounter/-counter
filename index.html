<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>60 BPM Counter</title>

<style>

body{

    margin:0;

    background:#fff;

    font-family:sans-serif;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    height:100vh;

    user-select:none;

}

#set{

    position:absolute;

    top:40px;

    font-size:40px;

    font-weight:bold;

}

#count{

    font-size:35vw;

    font-weight:bold;

    line-height:1;

}

#message{

    position:absolute;

    bottom:50px;

    font-size:28px;

}

</style>

</head>

<body>

<div id="set"></div>

<div id="count">▶</div>

<div id="message">タップして開始</div>

<script>

const TOTAL_SETS = 10;

const BPM = 60;

const INTERVAL = 60000 / BPM;

const setLabel = document.getElementById("set");

const countLabel = document.getElementById("count");

const messageLabel = document.getElementById("message");

let running = false;

function sleep(ms){

    return new Promise(resolve => setTimeout(resolve, ms));

}

function speak(text){

    const uttr = new SpeechSynthesisUtterance(text);

    uttr.lang = "ja-JP";

    speechSynthesis.speak(uttr);

}

async function startCounter(){

    if(running) return;

    running = true;

    messageLabel.textContent = "";

    for(let setNum=1; setNum<=TOTAL_SETS; setNum++){

        setLabel.textContent =

            "Set " + setNum + "/" + TOTAL_SETS;

        const counts =

            [setNum,2,3,4,5,6,7,8];

        for(const n of counts){

            countLabel.textContent = n;

            speak(String(n));

            await sleep(INTERVAL);

        }

    }

    setLabel.textContent = "";

    countLabel.textContent = "終了";

    messageLabel.textContent =

        "タップして再スタート";

    speak("終了です");

    running = false;

}

document.body.addEventListener(

    "click",

    startCounter

);

</script>

</body>

</html>
